name: ecom-frontend

# The frontend stack has its own network and no dependency on backend containers. It reaches
# the platform only through the API gateway URL. The one shared piece is the "ecom-gateway"
# network, created by the backend stack, which only Kong is attached to. That lets the Next.js
# servers call http://kong:8000 directly, so Kong never has to be published on a host address.
# Start the backend stack first (it creates the network).
networks:
  web:
    driver: bridge
  gateway:
    external: true
    name: ecom-gateway

services:
  storefront:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-BD Shop}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3100}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-BDT}
        NEXT_PUBLIC_DELIVERY_FLAT_RATE: ${NEXT_PUBLIC_DELIVERY_FLAT_RATE:-120}
        NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD: ${NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD:-5000}
        NEXT_PUBLIC_SITE_LOGO: ${NEXT_PUBLIC_SITE_LOGO:-}
        NEXT_PUBLIC_SITE_LOGO_WIDTH: ${NEXT_PUBLIC_SITE_LOGO_WIDTH:-120}
        NEXT_PUBLIC_SITE_LOGO_HEIGHT: ${NEXT_PUBLIC_SITE_LOGO_HEIGHT:-32}
        NEXT_PUBLIC_SITE_LOGO_WITH_NAME: ${NEXT_PUBLIC_SITE_LOGO_WITH_NAME:-false}
        NEXT_PUBLIC_OWNER_NAME: ${NEXT_PUBLIC_OWNER_NAME:-}
        NEXT_PUBLIC_OWNER_ROLE: ${NEXT_PUBLIC_OWNER_ROLE:-}
        NEXT_PUBLIC_OWNER_IMAGE: ${NEXT_PUBLIC_OWNER_IMAGE:-}
    image: ecom/storefront:${IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [web, gateway]
    environment:
      # Server-side only. The browser never receives this, and never holds a token.
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://kong:8000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aurelia_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-BD Shop}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-BDT}
      NEXT_PUBLIC_DELIVERY_FLAT_RATE: ${NEXT_PUBLIC_DELIVERY_FLAT_RATE:-120}
      NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD: ${NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD:-5000}
      NEXT_PUBLIC_SITE_LOGO: ${NEXT_PUBLIC_SITE_LOGO:-}
      NEXT_PUBLIC_SITE_LOGO_WIDTH: ${NEXT_PUBLIC_SITE_LOGO_WIDTH:-120}
      NEXT_PUBLIC_SITE_LOGO_HEIGHT: ${NEXT_PUBLIC_SITE_LOGO_HEIGHT:-32}
      NEXT_PUBLIC_SITE_LOGO_WITH_NAME: ${NEXT_PUBLIC_SITE_LOGO_WITH_NAME:-false}
      NEXT_PUBLIC_OWNER_NAME: ${NEXT_PUBLIC_OWNER_NAME:-}
      NEXT_PUBLIC_OWNER_ROLE: ${NEXT_PUBLIC_OWNER_ROLE:-}
      NEXT_PUBLIC_OWNER_IMAGE: ${NEXT_PUBLIC_OWNER_IMAGE:-}
    ports:
      # Behind a reverse proxy later, set STOREFRONT_BIND_ADDR=127.0.0.1.
      - "${STOREFRONT_BIND_ADDR:-0.0.0.0}:${STOREFRONT_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-BD Shop}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-BDT}
        NEXT_PUBLIC_DELIVERY_FLAT_RATE: ${NEXT_PUBLIC_DELIVERY_FLAT_RATE:-120}
        NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD: ${NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD:-5000}
        NEXT_PUBLIC_SITE_LOGO: ${NEXT_PUBLIC_SITE_LOGO:-}
        NEXT_PUBLIC_SITE_LOGO_WIDTH: ${NEXT_PUBLIC_SITE_LOGO_WIDTH:-120}
        NEXT_PUBLIC_SITE_LOGO_HEIGHT: ${NEXT_PUBLIC_SITE_LOGO_HEIGHT:-32}
        NEXT_PUBLIC_SITE_LOGO_WITH_NAME: ${NEXT_PUBLIC_SITE_LOGO_WITH_NAME:-false}
        NEXT_PUBLIC_OWNER_NAME: ${NEXT_PUBLIC_OWNER_NAME:-}
        NEXT_PUBLIC_OWNER_ROLE: ${NEXT_PUBLIC_OWNER_ROLE:-}
        NEXT_PUBLIC_OWNER_IMAGE: ${NEXT_PUBLIC_OWNER_IMAGE:-}
    image: ecom/admin-app:${IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [web, gateway]
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://kong:8000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aurelia_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-BD Shop}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_LOGO: ${NEXT_PUBLIC_SITE_LOGO:-}
      NEXT_PUBLIC_SITE_LOGO_WIDTH: ${NEXT_PUBLIC_SITE_LOGO_WIDTH:-120}
      NEXT_PUBLIC_SITE_LOGO_HEIGHT: ${NEXT_PUBLIC_SITE_LOGO_HEIGHT:-32}
      NEXT_PUBLIC_SITE_LOGO_WITH_NAME: ${NEXT_PUBLIC_SITE_LOGO_WITH_NAME:-false}
      NEXT_PUBLIC_OWNER_NAME: ${NEXT_PUBLIC_OWNER_NAME:-}
      NEXT_PUBLIC_OWNER_ROLE: ${NEXT_PUBLIC_OWNER_ROLE:-}
      NEXT_PUBLIC_OWNER_IMAGE: ${NEXT_PUBLIC_OWNER_IMAGE:-}
    ports:
      # The operations console is loopback-only by default (not a public surface).
      # For testing from another machine, set ADMIN_BIND_ADDR=0.0.0.0 in .env.
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-3100}:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }