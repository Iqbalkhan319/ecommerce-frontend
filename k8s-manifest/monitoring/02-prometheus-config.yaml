apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      - job_name: cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # RabbitMQ: ecom namespace-er pod ke sorasori discover kore :15692 scrape kore
      - job_name: rabbitmq
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["ecom"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: rabbitmq
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:15692"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: kong
        metrics_path: /metrics
        static_configs:
          - targets: ["kong.ecom.svc:8100"]

      # ---- Uptime: browser-e jei UI gulo khule ----
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://storefront.ecom.svc:3000
              - http://admin-ui.ecom.svc:3100/login
              - http://kong-admin.ecom.svc:8002
              - http://kong-admin.ecom.svc:8001
              - http://rabbitmq.ecom.svc:15672
              - http://redisinsight.ecom.svc:5540
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      # ---- Uptime: backend service, DB, queue (TCP port open kina) ----
      - job_name: blackbox-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
              - auth-service.ecom.svc:3001
              - admin-service.ecom.svc:3002
              - public-service.ecom.svc:3003
              - kong.ecom.svc:8000
              - postgres.ecom.svc:5432
              - redis.ecom.svc:6379
              - rabbitmq.ecom.svc:5672
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      - job_name: redis
        static_configs:
          - targets: ["redis-exporter.monitoring.svc:9121"]

      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter.monitoring.svc:9187"]
