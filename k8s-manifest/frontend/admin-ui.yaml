apiVersion: v1
kind: Service
metadata:
  name: admin-ui
spec:
  selector:
    app: admin-ui
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "ecom-nodejs"
    spec:
      enableServiceLinks: false
      containers:
      - name: admin-ui
        image: nuruzzaman24x/ecom-admin-ui:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3100
        env:
        - {name: NODE_OPTIONS, value: "--enable-source-maps"}
        - {name: PORT, value: "3100"}
        - {name: API_GATEWAY_URL, value: "http://kong:8000"}
        - {name: SESSION_COOKIE_NAME, value: aurelia_session}
        - {name: SESSION_COOKIE_SECURE, value: "true"}
        readinessProbe:
          httpGet: {path: /api/health, port: 3100}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /api/health, port: 3100}
          initialDelaySeconds: 40
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
