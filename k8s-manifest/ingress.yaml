apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-frontend
  namespace: ecom
  annotations:
    cert-manager.io/cluster-issuer: ecom-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [shop.local, admin.local]
    secretName: shop-tls
  rules:
  - host: shop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storefront
            port:
              number: 3000
  - host: admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-ui
            port:
              number: 3100
